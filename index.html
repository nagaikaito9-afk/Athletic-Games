<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Dカービィ風アクション</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <div class="controls">
            <p>操作: [← / →] または [A / D] で移動<br>
               [スペース] または [↑ / W] でジャンプ・空中でホバリング<br>
               ドアの前で [↑] または [W] で入る</p>
            <button id="save-btn">セーブ</button>
            <button id="load-btn">ロード</button>
        </div>
        <div class="score-board">
            HP: <span id="hp-display">10</span> / 10<br>
            状態: <span id="stage-display">マップ</span><br>
            <span id="action-hint" style="color: red; font-weight: bold;"></span>
        </div>
    </div>
    
    <canvas id="game-canvas"></canvas>
    
    <script src="script.js"></script>
</body>
</html>
